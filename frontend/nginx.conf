# Serves the built web app and forwards its API calls, as the Vite dev server does in development.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The model service: docker-compose.yml names its container "backend".
    location /api/ {
        proxy_pass http://backend:8000;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # File names under /assets/ change with their content, so they can be kept by the browser.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
